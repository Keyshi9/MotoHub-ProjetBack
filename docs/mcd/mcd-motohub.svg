<rect x="60" y="800" width="560" height="168" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="76" y="826" font-size="15" font-weight="bold" fill="#1f2937">Légende</text>
<text x="76" y="850" font-size="13" fill="#4b5563">Rectangle : entité (nom en majuscules, identifiant souligné en tête)</text>
<text x="76" y="871" font-size="13" fill="#4b5563">Ellipse : association (verbe), reliée aux entités par un trait</text>
<text x="76" y="892" font-size="13" fill="#4b5563">(min,max) : cardinalités de l'entité dans l'association</text>
<text x="76" y="913" font-size="13" fill="#4b5563">0,n = zéro à plusieurs · 1,1 = un et un seul · 0,1 = zéro ou un</text>
<text x="76" y="934" font-size="13" fill="#4b5563">Les clés étrangères n'apparaissent pas dans le MCD : elles naîtront</text>
<text x="76" y="955" font-size="13" fill="#4b5563">des associations lors du passage au MLD.</text>
<rect x="650" y="800" width="690" height="168" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="666" y="826" font-size="15" font-weight="bold" fill="#1f2937">Contraintes non exprimables par le MCD (règles métier du cahier des charges)</text>
<text x="666" y="850" font-size="13" fill="#4b5563">RB-07 : le client d'un rendez-vous est le propriétaire de la moto concernée.</text>
<text x="666" y="871" font-size="13" fill="#4b5563">RB-01 : e-mail d'utilisateur unique · RB-04 : immatriculation et n° de châssis uniques si renseignés.</text>
<text x="666" y="892" font-size="13" fill="#4b5563">RB-09 / RB-10 : statuts de rendez-vous et d'intervention limités à des valeurs définies.</text>
<text x="666" y="913" font-size="13" fill="#4b5563">RB-11 : kilométrage, coût estimé et coût final non négatifs.</text>
<text x="666" y="934" font-size="13" fill="#4b5563">RB-02 : le mot de passe est stocké haché, jamais en clair.</text>
<text x="1340" y="982" text-anchor="end" font-size="11" fill="#94a3b8">Source : cahier des charges MotoHub v1.0, section 4 « Modèle de données »</text>
</svg>